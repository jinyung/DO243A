<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=yes"
    />
    <title>NSYSU Grade Converter</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@stlite/browser@0.80.5/build/style.css"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@0.80.5/build/stlite.js"
mount(
  {
    requirements: ["pandas"],
    entrypoint: "grade_app.py",
    files: {
	"grade_app.py": {
	url: "./grade_app.py"
 	},
    },
  },
 document.getElementById("root")
)
    </script>
  </body>
</html>
