<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>DO243A Demos</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@stlite/browser@0.76.2/build/style.css"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@0.76.2/build/stlite.js"
mount(
  {
    requirements: ["cartopy", "matplotlib"],
    entrypoint: "welcome.py",
    files: {
	  "welcome.py": {
		url: "./welcome.py",
	  },
	  "pages/current.py": {
		url: "./current.py",
	  },
	  "sadcp_grid15moa.csv.gz": {
	    url: "./data/sadcp_grid15moa.csv.gz"
	  },
	},
  },
  document.getElementById("root")
)
    </script>
  </body>
</html>
