<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=yes"
    />
    <title>DO243A Demos</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@stlite/browser@0.76.2/build/style.css"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@0.76.2/build/stlite.js"
mount(
  {
    requirements: ["cartopy", "matplotlib", "plotly", "scikit-learn"],
    entrypoint: "Welcome.py",
    files: {
	  "Welcome.py": {
	    url: "./Welcome.py",
	  },
	  "pages/Translate_DNA.py": {
	    url: "Translate_DNA.py",
	  },
	  "pages/Ocean_current.py": {
	    url: "./Ocean_current.py",
	  },
	  "pages/Visualize_K_means_clustering.py": {
	    url: "Visualize_K_means_clustering.py",
	  },
	  "sadcp_grid15moa.csv.gz": {
	    url: "./data/sadcp_grid15moa.csv.gz"
	  },
	},
  },
  document.getElementById("root")
)
    </script>
  </body>
</html>
