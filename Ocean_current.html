<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=yes"
    />
    <title>DO243A Ocean current</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@stlite/browser@0.80.5/build/style.css"
    />
  </head>
  <body>
    <div id="ocean"></div>
    <script type="module">
import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@0.80.5/build/stlite.js"
mount(
  {
    requirements: ["cartopy", "matplotlib", "pandas", "streamlit"],
    entrypoint: "Ocean_current.py",
    files: {
      "Ocean_current.py": {
        url: "Ocean_current.py",
      },
      "sadcp_grid15moa.csv.gz": {
        url: "./data/sadcp_grid15moa.csv.gz"
      },
    },
  },
  document.getElementById("ocean")
)
    </script>
  </body>
</html>
